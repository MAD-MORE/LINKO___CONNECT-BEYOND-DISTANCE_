name: One-time History Startup Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Wire history recorder into LINKO startup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire history into startup and navigation
        shell: python
        run: |
          from pathlib import Path

          engine = Path('android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt')
          text = engine.read_text(encoding='utf-8')
          placeholder = '''@Composable fun SessionHistoryScreen() = Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) { Spacer(Modifier.height(10.dp)); Title("Session History", "Your verified LINKO session logs"); Spacer(Modifier.height(20.dp)); LinkoCard { Text("NO SESSION HISTORY", color = TextMuted, fontSize = 11.sp, fontFamily = JetBrainsMono, fontWeight = FontWeight.Bold); Spacer(Modifier.height(6.dp)); Text("Completed sessions will be logged here with byte counters and peer timestamps.", color = TextSub, fontSize = 12.sp, fontFamily = JetBrainsMono) } }'''
          delegate = '@Composable fun SessionHistoryScreen() = RealSessionHistoryScreen()'
          if placeholder in text:
              text = text.replace(placeholder, delegate, 1)
              engine.write_text(text, encoding='utf-8')

          main = Path('android/app/src/main/java/com/linkshare/app/MainActivity.kt')
          m = main.read_text(encoding='utf-8')
          import_line = 'import com.linkshare.app.network.LinkoSessionHistoryStore\n'
          if import_line not in m:
              anchor = 'import com.linkshare.app.network.LinkoRuntime\n'
              if anchor not in m:
                  raise SystemExit('MainActivity import anchor not found')
              m = m.replace(anchor, anchor + import_line, 1)
          startup_anchor = 'LinkoNotificationCenter.start(this)\n'
          startup_line = 'LinkoSessionHistoryStore.start(this)\n'
          if startup_line not in m:
              if startup_anchor not in m:
                  raise SystemExit('MainActivity notification startup anchor not found')
              m = m.replace(startup_anchor, startup_anchor + '            ' + startup_line, 1)
          main.write_text(m, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-history-startup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt android/app/src/main/java/com/linkshare/app/MainActivity.kt .github/workflows/one-time-history-startup.yml
          git commit -m "Wire history recorder into LINKO startup"
          git push origin main
