name: LINKO Candidate Full CI

on:
  push:
    branches: [linko-next-stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linko-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-full:
    name: Android Build, Test, Sign & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Cross-layer integrity check
        working-directory: .
        run: python android/scripts/verify_linko_integrity.py

      - name: Calculate build number
        id: build_number
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          echo "version_code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "version_name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}

      - name: Prepare candidate signing key
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/linko-dev.keystore
          keytool -genkeypair -noprompt \
            -alias linko-candidate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storetype JKS \
            -keystore android/linko-dev.keystore \
            -storepass candidate-store-password \
            -keypass candidate-key-password \
            -dname 'CN=LINKO Candidate,O=MAD-MORE,C=GH'
          keytool -list -storetype JKS -keystore android/linko-dev.keystore -storepass candidate-store-password -alias linko-candidate >/dev/null

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_KEYSTORE_PATH: linko-dev.keystore
          LINKO_KEYSTORE_PASSWORD: candidate-store-password
          LINKO_KEY_ALIAS: linko-candidate
          LINKO_KEY_PASSWORD: candidate-key-password

      - name: Verify signed APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-candidate-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-candidate-signed-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        working-directory: .
        run: rm -f android/linko-dev.keystore

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check
        working-directory: backend
        run: node --check src/server.js
      - name: Tests
        working-directory: backend
        run: timeout 30s npm test
        env:
          NODE_ENV: test
          LINKO_JWT_SECRET: test-secret-minimum-32-bytes-long-ok
          PORT: '18080'

  direct-p2p-contract:
    name: Verify Direct-P2P Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify active Android/control-plane code has no relay transport
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.sql' \
            '(RELAY_NODE_ID|RELAY_REGION|FLY_API_TOKEN|no_healthy_relay|relay_nodes)' \
            android backend/src backend/package.json 2>/dev/null
          echo 'Direct-P2P contract verified.'
