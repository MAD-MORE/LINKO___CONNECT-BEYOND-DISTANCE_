name: One-time Realtime cleanup fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Realtime cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/linkshare/app/network/LinkoRealtimeManager.kt")
          text = path.read_text(encoding="utf-8")

          old_signature = "    private fun cleanupRealtime() {\n        runCatching {\n            val realtime = client?.pluginManager?.getPlugin(Realtime)\n            presenceChannel?.let { realtime?.removeChannel(it) }\n            friendChannel?.let { realtime?.removeChannel(it) }\n            sessionChannel?.let { realtime?.removeChannel(it) }\n            realtime?.disconnect()\n        }.onFailure { Log.w(TAG, \"Realtime cleanup failed: ${it.message}\") }\n        presenceChannel = null\n        friendChannel = null\n        sessionChannel = null\n        client = null\n        connectedChannels.clear()\n        presenceSnapshot.clear()\n    }"

          new_cleanup = "    private suspend fun cleanupRealtime() {\n        try {\n            val realtime = client?.pluginManager?.getPlugin(Realtime)\n            presenceChannel?.let { realtime?.removeChannel(it) }\n            friendChannel?.let { realtime?.removeChannel(it) }\n            sessionChannel?.let { realtime?.removeChannel(it) }\n            realtime?.disconnect()\n        } catch (error: Throwable) {\n            Log.w(TAG, \"Realtime cleanup failed: ${error.message}\", error)\n        } finally {\n            presenceChannel = null\n            friendChannel = null\n            sessionChannel = null\n            client = null\n            connectedChannels.clear()\n            presenceSnapshot.clear()\n        }\n    }"

          if old_signature not in text:
              raise SystemExit("Expected cleanupRealtime implementation was not found")
          text = text.replace(old_signature, new_cleanup, 1)

          old_stop = "    fun stop() {\n        if (!started.compareAndSet(true, false)) return\n        cleanupRealtime()\n        LinkoDiagnosticTelemetry.recordRealtime(false, null, emptyList())\n    }"
          new_stop = "    fun stop() {\n        if (!started.compareAndSet(true, false)) return\n        scope.launch { cleanupRealtime() }\n        LinkoDiagnosticTelemetry.recordRealtime(false, null, emptyList())\n    }"
          if old_stop not in text:
              raise SystemExit("Expected stop() implementation was not found")
          text = text.replace(old_stop, new_stop, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/fix-realtime-cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/linkshare/app/network/LinkoRealtimeManager.kt .github/workflows/fix-realtime-cleanup.yml
          git commit -m "fix: make realtime channel cleanup suspend-safe [skip ci]"
          git push origin HEAD:main
