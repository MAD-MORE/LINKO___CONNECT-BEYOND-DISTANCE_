name: One-shot Diagnostic Compile Fix

on:
  push:
    paths:
      - '.github/workflows/_diagnostic_compile_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools
      - name: Apply and verify diagnostic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/java/com/linkshare/app/diagnostics/DiagnosticCenterScreen.kt')
          text = path.read_text(encoding='utf-8')
          old_import = 'import androidx.compose.ui.alpha'
          new_import = 'import androidx.compose.ui.draw.alpha'
          if old_import not in text:
              raise SystemExit('Expected bad alpha import was not found')
          text = text.replace(old_import, new_import, 1)
          text, n1 = re.subn(r'(private fun statusTint\(status: DiagnosticStatus\): Color = when \(status\) \{.*?DiagnosticStatus\.WAITING -> TextSub)(\n\})', r'\1\n    DiagnosticStatus.SKIPPED -> TextSub\2', text, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'statusTint replacement count={n1}')
          text, n2 = re.subn(r'(private fun statusLabel\(status: DiagnosticStatus\): String = when \(status\) \{.*?DiagnosticStatus\.WAITING -> "WAITING")(\n\})', r'\1\n    DiagnosticStatus.SKIPPED -> "SKIPPED"\2', text, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'statusLabel replacement count={n2}')
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/linkshare/app/diagnostics/DiagnosticCenterScreen.kt
          git commit -m 'fix(android): repair diagnostic status mappings and alpha import'
          git push origin HEAD:main

# retrigger