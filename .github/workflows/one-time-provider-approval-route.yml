name: One-time provider approval route fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(provider): jump to live screen after approval'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch approval navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt')
          s = p.read_text()
          old = 'composable(Screen.ProviderAuthorization.route) { ProviderAuthorizationScreen { LinkoEngineBridge.approvePendingProviderRequest { if (it == "approved") nav.navigate(Screen.ProviderSharingSetup.route) } } }'
          new = '''composable(Screen.ProviderAuthorization.route) {
                    ProviderAuthorizationScreen {
                        LinkoEngineBridge.approvePendingProviderRequest { result ->
                            if (result == "approved") {
                                nav.navigate(Screen.ProviderSharingActive.route) {
                                    popUpTo(Screen.ProviderAuthorization.route) { inclusive = true }
                                }
                            }
                        }
                    }
                }'''
          if old not in s:
              raise SystemExit('approval route pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix(provider): jump to live screen after approval"
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm -f .github/workflows/one-time-provider-approval-route.yml || true
          git diff --cached --quiet || git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: remove one-time provider route workflow"
          git push origin main || true
