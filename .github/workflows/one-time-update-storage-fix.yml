name: LINKO One-Time Update Storage Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'LINKO update storage cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch updater storage lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/com/linkshare/app/update/LinkoUpdateManager.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    private var expectedInstallVersionCode: Int? = null\n    private var latestRelease: ReleaseInfo? = null',
                  '    private var expectedInstallVersionCode: Int? = null\n    private var completedDownloadId = -1L\n    private var installerFile: File? = null\n    private var latestRelease: ReleaseInfo? = null'
              ),
              (
                  '    private val cache = appContext.getSharedPreferences(CACHE_NAME, Context.MODE_PRIVATE)\n\n    private val _state',
                  '    private val cache = appContext.getSharedPreferences(CACHE_NAME, Context.MODE_PRIVATE)\n\n    init {\n        cleanupUpdateArtifacts()\n    }\n\n    private val _state'
              ),
              (
                  '        if (installed.first >= expected) {\n            expectedInstallVersionCode = null',
                  '        if (installed.first >= expected) {\n            cleanupUpdateArtifacts()\n            expectedInstallVersionCode = null'
              ),
              (
                  '        } else if (_state.value.status == UpdateStatus.Installing) {\n            updateState(status = UpdateStatus.UpdateAvailable',
                  '        } else if (_state.value.status == UpdateStatus.Installing) {\n            cleanupUpdateArtifacts()\n            updateState(status = UpdateStatus.UpdateAvailable'
              ),
              (
                  '        if (activeDownloadId >= 0L) {\n            val manager = appContext.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager\n            runCatching { manager.remove(activeDownloadId) }\n        }\n        activeDownloadId = -1L',
                  '        if (activeDownloadId >= 0L) {\n            val manager = appContext.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager\n            runCatching { manager.remove(activeDownloadId) }\n        }\n        completedDownloadId = -1L\n        cleanupUpdateArtifacts()\n        activeDownloadId = -1L'
              ),
              (
                  '        val request = DownloadManager.Request(Uri.parse(release.apkUrl)).setTitle("LINKO ${release.versionName}").setDescription("Downloading LINKO update…").setMimeType(APK_MIME).setAllowedOverMetered(true).setAllowedOverRoaming(false).setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE).setDestinationInExternalFilesDir(appContext, Environment.DIRECTORY_DOWNLOADS, "LINKO-${release.versionCode}.apk")',
                  '        val request = DownloadManager.Request(Uri.parse(release.apkUrl)).setTitle("LINKO ${release.versionName}").setDescription("Downloading LINKO update…").setMimeType(APK_MIME).setAllowedOverMetered(true).setAllowedOverRoaming(false).setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE).setDestinationInExternalFilesDir(appContext, UPDATE_DIRECTORY, "LINKO-${release.versionCode}.apk")'
              ),
              (
                  '        val uri = manager.getUriForDownloadedFile(id)\n        activeDownloadId = -1L',
                  '        val uri = manager.getUriForDownloadedFile(id)\n        completedDownloadId = id\n        activeDownloadId = -1L'
              ),
              (
                  '        val installerFile = File(appContext.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "LINKO-${expectedInstallVersionCode ?: BuildConfig.VERSION_CODE}-installer.apk")\n        val installerUri = runCatching {\n            installerFile.parentFile?.mkdirs()',
                  '        val installerFile = File(appContext.getExternalFilesDir(UPDATE_DIRECTORY), "LINKO-${expectedInstallVersionCode ?: BuildConfig.VERSION_CODE}-installer.apk")\n        this.installerFile = installerFile\n        val installerUri = runCatching {\n            installerFile.parentFile?.mkdirs()'
              ),
              (
                  '            FileProvider.getUriForFile(appContext, "${appContext.packageName}.fileprovider", installerFile)\n        }.getOrElse',
                  '            completedDownloadId.takeIf { it >= 0L }?.let { downloadId ->\n                val manager = appContext.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager\n                runCatching { manager.remove(downloadId) }\n                completedDownloadId = -1L\n            }\n            FileProvider.getUriForFile(appContext, "${appContext.packageName}.fileprovider", installerFile)\n        }.getOrElse'
              ),
              (
                  '        runCatching { activity.startActivity(intent) }.onFailure { error ->\n            updateState(status = UpdateStatus.Error, statusMessage = "INSTALLATION FAILED", errorMessage = error.message ?: "Android could not start the LINKO package installer.")\n        }\n    }\n\n    private fun queryDownload',
                  '        runCatching { activity.startActivity(intent) }.onFailure { error ->\n            cleanupUpdateArtifacts()\n            updateState(status = UpdateStatus.Error, statusMessage = "INSTALLATION FAILED", errorMessage = error.message ?: "Android could not start the LINKO package installer.")\n        }\n    }\n\n    private fun cleanupUpdateArtifacts() {\n        val directories = listOfNotNull(\n            appContext.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS),\n            appContext.getExternalFilesDir(UPDATE_DIRECTORY),\n            appContext.cacheDir\n        ).distinct()\n        directories.forEach { directory ->\n            directory.listFiles()?.forEach { file ->\n                val name = file.name\n                if (name.startsWith("LINKO-") && name.endsWith(".apk") || name.startsWith("linko-update-") && name.endsWith(".apk")) {\n                    runCatching { file.delete() }\n                }\n            }\n        }\n        installerFile = null\n    }\n\n    private fun queryDownload'
              ),
              (
                  '        private const val APK_MIME = "application/vnd.android.package-archive"\n        private const val UPDATE_MANIFEST_NAME',
                  '        private const val APK_MIME = "application/vnd.android.package-archive"\n        private const val UPDATE_DIRECTORY = "linko-updates"\n        private const val UPDATE_MANIFEST_NAME'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match ({count}) for patch fragment: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('LINKO updater storage lifecycle patch applied.')
          PY

      - name: Commit updater fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/linkshare/app/update/LinkoUpdateManager.kt .github/workflows/one-time-update-storage-fix.yml
          git rm .github/workflows/one-time-update-storage-fix.yml
          git commit -m "Fix LINKO update storage cleanup"
          git push origin main
