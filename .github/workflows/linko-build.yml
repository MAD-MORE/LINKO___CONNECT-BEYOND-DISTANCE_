name: LINKO Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linko-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LINKO APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace --no-build-cache

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-build-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linko-build-diagnostics-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
