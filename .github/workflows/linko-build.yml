name: LINKO Build & Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend contract and test gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify backend package metadata
        run: |
          test -f package.json
          test -f tsconfig.json

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Backend tests
        run: npm test

  android:
    name: Build LINKO APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
          test -f scripts/validate_kotlin.py
          test -f scripts/verify_linko_integrity.py
          echo "Building commit: $(git -C .. rev-parse HEAD)"

      - name: Cross-layer LINKO integrity gate
        run: python3 scripts/verify_linko_integrity.py

      - name: Kotlin structural preflight
        run: python3 scripts/validate_kotlin.py

      - name: Kotlin compile preflight
        env:
          LINKO_CONTROL_PLANE_URL: ${{ vars.LINKO_CONTROL_PLANE_URL }}
          LINKO_SUPABASE_URL: ${{ vars.LINKO_SUPABASE_URL }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LINKO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:compileDebugKotlin --stacktrace --no-build-cache \
            -PLINKO_CONTROL_PLANE_URL="$LINKO_CONTROL_PLANE_URL" \
            -PLINKO_SUPABASE_URL="$LINKO_SUPABASE_URL" \
            -PLINKO_SUPABASE_PUBLISHABLE_KEY="$LINKO_SUPABASE_PUBLISHABLE_KEY"

      - name: Android lint gate
        env:
          LINKO_CONTROL_PLANE_URL: ${{ vars.LINKO_CONTROL_PLANE_URL }}
          LINKO_SUPABASE_URL: ${{ vars.LINKO_SUPABASE_URL }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LINKO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:lintDebug --stacktrace --no-build-cache \
            -PLINKO_CONTROL_PLANE_URL="$LINKO_CONTROL_PLANE_URL" \
            -PLINKO_SUPABASE_URL="$LINKO_SUPABASE_URL" \
            -PLINKO_SUPABASE_PUBLISHABLE_KEY="$LINKO_SUPABASE_PUBLISHABLE_KEY"

      - name: Clean debug APK build
        env:
          LINKO_CONTROL_PLANE_URL: ${{ vars.LINKO_CONTROL_PLANE_URL }}
          LINKO_SUPABASE_URL: ${{ vars.LINKO_SUPABASE_URL }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LINKO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace --no-build-cache \
            -PLINKO_CONTROL_PLANE_URL="$LINKO_CONTROL_PLANE_URL" \
            -PLINKO_SUPABASE_URL="$LINKO_SUPABASE_URL" \
            -PLINKO_SUPABASE_PUBLISHABLE_KEY="$LINKO_SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK and manifest outputs
        run: |
          set -euo pipefail
          apk="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "APK=$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
