name: LINKO Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build LINKO APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
          echo "Building commit: $(git -C .. rev-parse HEAD)"
      - name: Build debug APK (clean, no build cache)
        env:
          LINKO_CONTROL_PLANE_URL: ${{ vars.LINKO_CONTROL_PLANE_URL }}
        run: gradle clean assembleDebug --stacktrace --no-build-cache -PLINKO_CONTROL_PLANE_URL="$LINKO_CONTROL_PLANE_URL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
