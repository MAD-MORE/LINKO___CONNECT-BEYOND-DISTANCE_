name: LINKO Self-Healing Implementation (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'linko-next-stable' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linko-next-stable
          fetch-depth: 0

      - name: Apply bounded automatic recovery
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/java/com/linkshare/app/vpn/LinkShareVpnService.kt')
          text = path.read_text(encoding='utf-8')
          marker = 'AUTO_RECOVERY_V1'
          if marker not in text:
              old = '''        val socket = runCatching { DatagramSocket(0) }.getOrElse {
            Log.e(TAG, "Could not create direct UDP socket", it)
            releaseLocks()
            failSession(sessionId, generation, "udp_socket_creation_failed")
            stopSelf(startId)
            return START_NOT_STICKY
        }
        if (!protect(socket)) {
            Log.e(TAG, "Failed to protect direct UDP socket from VPN routing loop")
            socket.close()
            releaseLocks()
            failSession(sessionId, generation, "udp_socket_protection_failed")
            stopSelf(startId)
            return START_NOT_STICKY
        }

        running.set(false)
        LinkoEngineBridge.reportTunnelState("direct_connecting", "Finding a direct peer path")
        executor.execute { establishDirectTransport(sessionId, sessionKey.copyOf(), socket, intent, generation) }
'''
              new = '''        running.set(false)
        LinkoEngineBridge.reportTunnelState("direct_connecting", "Finding a direct peer path")
        // AUTO_RECOVERY_V1 keeps transient direct-network failures recoverable without creating a new session.
        executor.execute { establishDirectTransportWithRecovery(sessionId, sessionKey.copyOf(), intent, generation) }
'''
              if old not in text:
                  raise SystemExit('VPN startup block not found')
              text = text.replace(old, new, 1)

              anchor = '''    private fun establishDirectTransport(sessionId: String, sessionKey: ByteArray, socket: DatagramSocket, startupIntent: Intent?, generation: Long) {
'''
              recovery = '''    private fun establishDirectTransportWithRecovery(sessionId: String, sessionKey: ByteArray, startupIntent: Intent?, generation: Long) {
        val maxAttempts = AUTO_RECOVERY_MAX_ATTEMPTS
        var lastReason = "direct_connection_failed"
        for (attempt in 1..maxAttempts) {
            if (!isCurrent(sessionId, generation)) return
            var socket: DatagramSocket? = null
            try {
                if (attempt > 1) {
                    val delayMs = (AUTO_RECOVERY_INITIAL_DELAY_MS * (1L shl (attempt - 2))).coerceAtMost(AUTO_RECOVERY_MAX_DELAY_MS)
                    LinkoEngineBridge.reportTunnelState("reconnecting", "Trying the connection again")
                    LinkoEngineBridge.reportConnectionDiagnostic(
                        com.linkshare.app.network.ConnectionStage.ICE_CHECKING,
                        "AUTO_RECOVERY_ATTEMPT",
                        "Retrying direct connection attempt $attempt/$maxAttempts",
                        com.linkshare.app.network.ConnectionSeverity.INFO,
                        mapOf("attempt" to attempt.toString()),
                    )
                    Thread.sleep(delayMs)
                    if (!isCurrent(sessionId, generation)) return
                }
                socket = DatagramSocket(0).apply { reuseAddress = true }
                if (!protect(socket)) throw LinkoNetworkException("udp_socket_protection_failed")
                establishDirectTransport(sessionId, sessionKey.copyOf(), socket, startupIntent, generation)
                return
            } catch (_: CancellationExceptionLike) {
                socket?.close()
                return
            } catch (error: Exception) {
                lastReason = error.message?.takeIf { it.isNotBlank() } ?: "direct_connection_failed"
                Log.w(TAG, "AUTO_RECOVERY_FAILED session=$sessionId attempt=$attempt/$maxAttempts reason=$lastReason")
                socket?.close()
                if (!isCurrent(sessionId, generation)) return
            }
        }
        if (isCurrent(sessionId, generation)) {
            LinkoEngineBridge.reportConnectionDiagnostic(
                com.linkshare.app.network.ConnectionStage.FAILED,
                "AUTO_RECOVERY_EXHAUSTED",
                "Direct connection recovery attempts exhausted",
                com.linkshare.app.network.ConnectionSeverity.ERROR,
                mapOf("attempts" to maxAttempts.toString()),
            )
            failSession(sessionId, generation, lastReason)
        }
    }

'''
              if anchor not in text:
                  raise SystemExit('Direct transport anchor not found')
              text = text.replace(anchor, recovery + anchor, 1)

              old_catch = '''        } catch (e: Exception) {
            if (!isCurrent(sessionId, generation)) {
                runCatching { socket.close() }
                return
            }
            Log.e(TAG, "Direct P2P connection failed: ${e.message}", e)
            runCatching { socket.close() }
            failSession(sessionId, generation, e.message ?: "direct_connection_failed", e)
        }
'''
              new_catch = '''        } catch (e: Exception) {
            runCatching { socket.close() }
            if (!isCurrent(sessionId, generation)) return
            Log.w(TAG, "Direct P2P attempt failed; recovery controller will retry: ${e.message}", e)
            throw e
        }
'''
              if old_catch not in text:
                  raise SystemExit('Direct transport catch block not found')
              text = text.replace(old_catch, new_catch, 1)

              constants_anchor = '''        private const val MAX_TUN_PAYLOAD = 32 * 1024
'''
              constants = '''        private const val AUTO_RECOVERY_MAX_ATTEMPTS = 4
        private const val AUTO_RECOVERY_INITIAL_DELAY_MS = 1_500L
        private const val AUTO_RECOVERY_MAX_DELAY_MS = 8_000L
'''
              if constants_anchor not in text:
                  raise SystemExit('Companion constants anchor not found')
              text = text.replace(constants_anchor, constants + constants_anchor, 1)
              path.write_text(text, encoding='utf-8')
              print('Applied bounded automatic recovery')
          else:
              print('Recovery already implemented')

      - name: Commit source and remove temporary patch workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/linko-self-healing-pr.yml .github/workflows/linko-self-healing-implementation.yml 2>/dev/null || true
          git add android/app/src/main/java/com/linkshare/app/vpn/LinkShareVpnService.kt
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Add bounded automatic connection recovery"
          git push origin HEAD:linko-next-stable
