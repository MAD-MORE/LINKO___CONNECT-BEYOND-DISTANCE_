name: LINKO CI Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linko-ci-trigger.yml'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm LINKO CI trigger
        run: echo "LINKO CI trigger started successfully"
