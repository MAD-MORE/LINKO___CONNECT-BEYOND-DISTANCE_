name: LINKO Android CI

on:
  push:
    branches: [main, develop, feature/real-data-plane-internet-sharing]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Calculate build number
        id: build_number
        working-directory: .
        shell: bash
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "LINKO build ${VERSION_NAME} (${BUILD_NUMBER})"
      - name: Verify cross-layer integrity
        working-directory: .
        run: python android/scripts/verify_linko_integrity.py
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable development signing key
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.LINKO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINKO_KEY_ALIAS || 'linko' }}
          KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || { echo "LINKO_KEYSTORE_BASE64 is required for in-place updates"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "LINKO_KEYSTORE_PASSWORD is required for in-place updates"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "LINKO_KEY_PASSWORD is required for in-place updates"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "LINKO_KEY_ALIAS is required for in-place updates"; exit 1; }

          work_dir="$RUNNER_TEMP/linko-signing"
          mkdir -p "$work_dir"
          rm -f "$work_dir"/*

          # Recover the keystore without changing its signing identity.
          # The resolver intentionally tries only reversible encodings:
          #   1) plain Base64
          #   2) Base64 wrapped in quotes/data-URI text
          #   3) URL-safe Base64 normalization
          #   4) one additional Base64 decode for accidental double-encoding
          python - "$KEYSTORE_B64" "$work_dir" <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          value = sys.argv[1].strip()
          out = sys.argv[2]

          candidates = []

          def add(label, text):
              if text is None:
                  return
              text = text.strip()
              if text.startswith('data:') and ';base64,' in text:
                  text = text.split(';base64,', 1)[1]
              if len(text) >= 2 and text[0] == text[-1] and text[0] in {'"', "'"}:
                  text = text[1:-1].strip()
              text = re.sub(r'\s+', '', text)
              if text:
                  candidates.append((label, text))

          add('original', value)

          # URL-safe -> standard Base64 representation.
          normalized = value.strip().replace('-', '+').replace('_', '/')
          add('urlsafe-normalized', normalized)

          # Generate one level of decoded text to catch accidental double Base64 encoding.
          for label, text in list(candidates):
              padded = text + ('=' * ((4 - len(text) % 4) % 4))
              try:
                  decoded = base64.b64decode(padded, validate=True)
                  try:
                      decoded_text = decoded.decode('ascii')
                  except UnicodeDecodeError:
                      continue
                  add(label + '-decoded-text', decoded_text)
              except (binascii.Error, ValueError):
                  continue

          seen = set()
          for index, (label, text) in enumerate(candidates):
              if text in seen:
                  continue
              seen.add(text)
              padded = text + ('=' * ((4 - len(text) % 4) % 4))
              try:
                  raw = base64.b64decode(padded, validate=True)
              except (binascii.Error, ValueError):
                  continue
              path = os.path.join(out, f'candidate-{index}-{label}.bin')
              with open(path, 'wb') as handle:
                  handle.write(raw)
          PY

          raw_keystore="$work_dir/raw-keystore"
          normalized_keystore="$work_dir/linko-keystore.jks"
          found=""

          # Validate every candidate against the supplied password. This avoids
          # guessing the keystore format from the filename or extension.
          for candidate in "$work_dir"/candidate-*.bin; do
            [ -f "$candidate" ] || continue

            if keytool -list -storetype JKS -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              cp "$candidate" "$normalized_keystore"
              found="jks"
              echo "LINKO signing key validated as JKS using encoding recovery."
              break
            fi

            if keytool -list -storetype PKCS12 -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              cp "$candidate" "$raw_keystore"
              echo "LINKO signing secret is PKCS12; normalizing it to JKS without changing the signing identity."
              keytool -importkeystore \
                -noprompt \
                -srckeystore "$raw_keystore" \
                -srcstoretype PKCS12 \
                -srcstorepass "$KEYSTORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" \
                -srckeypass "$KEY_PASSWORD" \
                -destkeystore "$normalized_keystore" \
                -deststoretype JKS \
                -deststorepass "$KEYSTORE_PASSWORD" \
                -destalias "$KEY_ALIAS" \
                -destkeypass "$KEY_PASSWORD"
              found="pkcs12"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "LINKO signing key recovery failed: no supplied Base64 candidate matches JKS or PKCS12 with the configured password."
            echo "The CI cannot safely invent a replacement signing key because that could break in-place updates."
            exit 1
          fi

          keytool -list -storetype JKS -keystore "$normalized_keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cp "$normalized_keystore" android/linko-dev.keystore
          echo "Stable LINKO signing identity validated: alias=$KEY_ALIAS, type=JKS."
      - name: Build signed update APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          LINKO_KEY_ALIAS: ${{ secrets.LINKO_KEY_ALIAS || 'linko' }}
          LINKO_KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload signed release APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linko-signed-release-${{ steps.build_number.outputs.version_name }}-${{ steps.build_number.outputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest LINKO development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.build_number.outputs.version_code }}
          VERSION_NAME: ${{ steps.build_number.outputs.version_name }}
        run: |
          gh release create "dev-build-${VERSION_CODE}" \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "LINKO development build ${VERSION_NAME} (${VERSION_CODE})" \
            --notes "Automatic development build from commit ${GITHUB_SHA}. This release is consumed by the LINKO in-app updater." \
            --latest
      - name: Remove signing key
        if: always()
        working-directory: .
        run: rm -f android/linko-dev.keystore
