name: LINKO Android CI

on:
  push:
    branches: [main, develop, feature/real-data-plane-internet-sharing]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Calculate build number
        id: build_number
        working-directory: .
        shell: bash
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "LINKO build ${VERSION_NAME} (${BUILD_NUMBER})"
      - name: Verify cross-layer integrity
        working-directory: .
        run: python android/scripts/verify_linko_integrity.py
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable development signing key
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.LINKO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINKO_KEY_ALIAS || 'linko' }}
          KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "LINKO_KEYSTORE_BASE64 is required for in-place updates"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "LINKO_KEYSTORE_PASSWORD is required for in-place updates"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "LINKO_KEY_PASSWORD is required for in-place updates"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "LINKO_KEY_ALIAS is required for in-place updates"; exit 1; }

          work_dir="$RUNNER_TEMP/linko-signing"
          mkdir -p "$work_dir"
          rm -f "$work_dir"/*

          python - "$KEYSTORE_B64" "$work_dir" <<'PY'
          import base64, binascii, os, re, sys
          raw = sys.argv[1].strip()
          out = sys.argv[2]
          candidates=[]; seen=set()
          def add(text):
              text=text.strip().replace('\\r\\n','\\n').replace('\\n','\\n').replace('\\r','\\r')
              if text.startswith('data:') and ';base64,' in text: text=text.split(';base64,',1)[1]
              if len(text)>=2 and text[0]==text[-1] and text[0] in {'"', "'"}: text=text[1:-1].strip()
              text=re.sub(r'\\s+','',text)
              if text and text not in seen: seen.add(text); candidates.append(text)
          add(raw); add(raw.replace('-','+').replace('_','/'))
          i=0
          while i<len(candidates) and i<64:
              text=candidates[i]; i+=1
              padded=text+'='*((4-len(text)%4)%4)
              for mode,payload in [('standard',padded),('urlsafe',padded.replace('+','-').replace('/','_'))]:
                  try:
                      data=base64.urlsafe_b64decode(payload) if mode=='urlsafe' else base64.b64decode(payload,validate=True)
                  except (binascii.Error,ValueError): continue
                  path=os.path.join(out,f'candidate-{i}-{mode}.bin')
                  open(path,'wb').write(data)
                  try: decoded=data.decode('ascii')
                  except UnicodeDecodeError: decoded=''
                  if decoded: add(decoded)
          PY

          normalized="$work_dir/linko-keystore.jks"
          found=""
          for candidate in "$work_dir"/candidate-*.bin; do
            [ -f "$candidate" ] || continue
            if keytool -list -storetype JKS -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              cp "$candidate" "$normalized"; found=jks; break
            fi
            for source_type in PKCS12 JCEKS; do
              if keytool -list -storetype "$source_type" -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
                alias="$KEY_ALIAS"
                if ! keytool -list -storetype "$source_type" -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" -alias "$alias" >/dev/null 2>&1; then
                  alias="$(keytool -list -storetype "$source_type" -keystore "$candidate" -storepass "$KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | xargs)"
                fi
                [ -n "$alias" ] || continue
                echo "Recovered signing alias from keystore metadata."
                keytool -importkeystore -noprompt -srckeystore "$candidate" -srcstoretype "$source_type" -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$alias" -srckeypass "$KEY_PASSWORD" -destkeystore "$normalized" -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -destalias "$alias" -destkeypass "$KEY_PASSWORD"
                found="$source_type"; echo "LINKO signing secret normalized from $source_type."; break 2
              fi
            done
          done
          [ -n "$found" ] || { echo "LINKO signing key recovery failed: no candidate matches the configured store password."; exit 1; }

          if ! keytool -list -storetype JKS -keystore "$normalized" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            discovered="$(keytool -list -storetype JKS -keystore "$normalized" -storepass "$KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | xargs)"
            [ -n "$discovered" ] || { echo "LINKO signing keystore contains no PrivateKeyEntry."; exit 1; }
            echo "Recovered signing alias from normalized JKS."
            keytool -importkeystore -noprompt -srckeystore "$normalized" -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$discovered" -srckeypass "$KEY_PASSWORD" -destkeystore android/linko-dev.keystore -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -destalias "$discovered" -destkeypass "$KEY_PASSWORD"
          else
            cp "$normalized" android/linko-dev.keystore
          fi
          keytool -list -storetype JKS -keystore android/linko-dev.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Stable LINKO signing keystore validated."
      - name: Build signed update APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          LINKO_KEY_ALIAS: ${{ secrets.LINKO_KEY_ALIAS || 'linko' }}
          LINKO_KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload signed release APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linko-signed-release-${{ steps.build_number.outputs.version_name }}-${{ steps.build_number.outputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest LINKO development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.build_number.outputs.version_code }}
          VERSION_NAME: ${{ steps.build_number.outputs.version_name }}
        run: |
          gh release create "dev-build-${VERSION_CODE}" android/app/build/outputs/apk/release/app-release.apk --title "LINKO development build ${VERSION_NAME} (${VERSION_CODE})" --notes "Automatic development build from commit ${GITHUB_SHA}." --latest
      - name: Remove signing key
        if: always()
        working-directory: .
        run: rm -f android/linko-dev.keystore
