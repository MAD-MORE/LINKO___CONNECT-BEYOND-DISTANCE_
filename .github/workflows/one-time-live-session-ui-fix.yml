name: LINKO one-time live session UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-live-ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Keep live session screens visible
        shell: python
        run: |
          from pathlib import Path

          p = Path('android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt')
          s = p.read_text()
          replacements = {
              'composable(Screen.RxConnecting.route) { ConnectionStatusScreen(onConnected = { nav.navigate(Screen.Connected.route) }, onFailed = { nav.navigate(Screen.ConnectionLost.route) }) }':
              'composable(Screen.RxConnecting.route) { ConnectionStatusScreen(onConnected = {}, onFailed = { nav.navigate(Screen.ConnectionLost.route) }) }',
              'composable(Screen.ProviderSharingSetup.route) { ProviderSharingSetupScreen { nav.navigate(Screen.HomeEngine.route) } }':
              'composable(Screen.ProviderSharingSetup.route) { ProviderSharingSetupScreen { nav.navigate(Screen.ProviderSharingActive.route) } }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected LinkoApp route: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify route wiring
        run: |
          grep -F 'composable(Screen.RxConnecting.route) { ConnectionStatusScreen(onConnected = {},' android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt
          grep -F 'composable(Screen.ProviderSharingSetup.route) { ProviderSharingSetupScreen { nav.navigate(Screen.ProviderSharingActive.route) } }' android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt
          git rm .github/workflows/one-time-live-session-ui-fix.yml
          git commit -m 'fix(android): keep live session controls visible [skip-live-ui-fix]'
          git push origin main
