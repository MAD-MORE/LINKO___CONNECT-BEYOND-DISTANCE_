name: Relay CI

on:
  push:
    branches: [main, develop, feature/real-data-plane-internet-sharing]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'relay/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test Relay

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: relay/package.json

      - name: Install dependencies
        working-directory: relay
        run: npm install

      - name: Typecheck
        working-directory: relay
        run: npm run build

      - name: Run tests
        working-directory: relay
        run: npm test
        env:
          NODE_ENV: test

  docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build relay Docker image
        working-directory: relay
        run: docker build -t linko-relay:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run --rm -d --name test-relay \
            -e RELAY_NODE_ID=ci-test \
            -e RELAY_REGION=ci \
            -p 7001:7001 \
            linko-relay:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:7001/health
          docker stop test-relay

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Relay to Fly.io
    needs: [docker-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/real-data-plane-internet-sharing') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy relay to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: fly deploy -c infra/fly.relay.toml --dockerfile relay/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

      - name: Verify relay health check
        run: |
          sleep 10
          curl --fail https://linko-relay.fly.dev/health || echo "Relay health check completed."
