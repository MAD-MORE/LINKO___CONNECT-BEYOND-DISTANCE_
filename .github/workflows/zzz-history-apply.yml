name: Apply real history navigation wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace History placeholder and ensure recorder startup
        shell: python
        run: |
          from pathlib import Path

          engine = Path('android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt')
          text = engine.read_text(encoding='utf-8')
          old = '''@Composable fun SessionHistoryScreen() = Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) { Spacer(Modifier.height(10.dp)); Title("Session History", "Your verified LINKO session logs"); Spacer(Modifier.height(20.dp)); LinkoCard { Text("NO SESSION HISTORY", color = TextMuted, fontSize = 11.sp, fontFamily = JetBrainsMono, fontWeight = FontWeight.Bold); Spacer(Modifier.height(6.dp)); Text("Completed sessions will be logged here with byte counters and peer timestamps.", color = TextSub, fontSize = 12.sp, fontFamily = JetBrainsMono) } }'''
          new = '@Composable fun SessionHistoryScreen() = RealSessionHistoryScreen()'
          if old in text:
              engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('android/app/src/main/java/com/linkshare/app/MainActivity.kt')
          m = main.read_text(encoding='utf-8')
          import_anchor = 'import com.linkshare.app.network.LinkoRuntime\n'
          import_line = 'import com.linkshare.app.network.LinkoSessionHistoryStore\n'
          if import_line not in m:
              if import_anchor not in m:
                  raise SystemExit('History store import anchor not found')
              m = m.replace(import_anchor, import_anchor + import_line, 1)
          startup_anchor = '            LinkoNotificationCenter.start(this)\n'
          startup_line = '            LinkoSessionHistoryStore.start(this)\n'
          if startup_line not in m:
              if startup_anchor not in m:
                  raise SystemExit('History store startup anchor not found')
              m = m.replace(startup_anchor, startup_anchor + startup_line, 1)
          main.write_text(m, encoding='utf-8')

      - name: Verify wiring exists
        run: |
          grep -Fq 'RealSessionHistoryScreen()' android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt
          grep -Fq 'import com.linkshare.app.network.LinkoSessionHistoryStore' android/app/src/main/java/com/linkshare/app/MainActivity.kt
          grep -Fq 'LinkoSessionHistoryStore.start(this)' android/app/src/main/java/com/linkshare/app/MainActivity.kt

      - name: Remove one-shot patcher and commit
        run: |
          rm -f .github/workflows/zzz-history-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt android/app/src/main/java/com/linkshare/app/MainActivity.kt .github/workflows/zzz-history-apply.yml
          git commit -m "Wire real session history into LINKO"
          git push origin main
