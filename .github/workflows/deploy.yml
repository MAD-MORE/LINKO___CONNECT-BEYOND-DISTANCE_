name: Deploy LINKO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly secrets
        run: |
          flyctl secrets set \
            LINKO_DATABASE_URL="${{ secrets.LINKO_DATABASE_URL }}" \
            LINKO_JWT_SECRET="${{ secrets.LINKO_JWT_SECRET }}" \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            SUPABASE_SECRET_KEY="${{ secrets.SUPABASE_SECRET_KEY }}" \
            LINKO_ADMIN_SECRET="${{ secrets.LINKO_ADMIN_SECRET }}" \
            TUNNEL_HOST="linko-relay.fly.dev" \
            TUNNEL_PORT="7000" \
            --app linkoconnect-beyond-distance \
            --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

      - name: Deploy backend
        run: |
          flyctl deploy \
            --config infra/fly.backend.toml \
            --dockerfile infra/backend.dockerfile \
            --app linkoconnect-beyond-distance \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
