name: Deploy Relay Node

on:
  push:
    branches: [main, fix/fly-relay-production]
    paths:
      - 'relay/**'
      - 'infra/fly.relay.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-relay-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-relay:
    name: Deploy Relay Node to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check FLY_API_TOKEN
        if: env.FLY_API_TOKEN == ''
        run: |
          echo "::error::FLY_API_TOKEN secret is missing in GitHub repository secrets."
          echo "Please generate a Fly.io access token ('fly auth token') and add it to GitHub Settings -> Secrets and variables -> Actions as FLY_API_TOKEN."
          exit 1

      - name: Deploy LINKO UDP Relay to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl deploy ./relay \
            --app linko-relay \
            --remote-only

      - name: Verify Relay Health Endpoint
        if: env.FLY_API_TOKEN != ''
        run: |
          echo "Waiting 10 seconds for Fly machine to boot..."
          sleep 10
          curl --fail --show-error --silent --max-time 15 http://66.241.125.170/health -H "Host: linko-relay.fly.dev" || curl --fail --show-error --silent --max-time 15 https://linko-relay.fly.dev/health
          echo ""
          echo "Relay health check verified successfully!"
