name: Deploy Relay Node

on:
  push:
    branches: [main, fix/fly-relay-production]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-relay-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-relay:
    name: Deploy LINKO UDP Relay to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The URL is not secret; keeping the default here prevents environment drift.
      LINKO_RELAY_HEARTBEAT_URL: ${{ secrets.LINKO_RELAY_HEARTBEAT_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-relay-heartbeat' }}
      LINKO_RELAY_REGISTRATION_TOKEN: ${{ secrets.LINKO_RELAY_REGISTRATION_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly authentication and relay registration secret
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${LINKO_RELAY_REGISTRATION_TOKEN}" ]; then
            echo "::error::LINKO_RELAY_REGISTRATION_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          flyctl auth whoami

      - name: Ensure dedicated IPv4 for UDP
        run: |
          if ! flyctl ips list --app linko-relay | grep -q "v4"; then
            flyctl ips allocate-v4 --app linko-relay
          fi

      - name: Configure relay control-plane credentials
        run: |
          flyctl secrets set \
            LINKO_RELAY_HEARTBEAT_URL="${LINKO_RELAY_HEARTBEAT_URL}" \
            LINKO_RELAY_REGISTRATION_TOKEN="${LINKO_RELAY_REGISTRATION_TOKEN}" \
            RELAY_NODE_ID="relay-1" \
            RELAY_PUBLIC_HOST="linko-relay.fly.dev" \
            --app linko-relay

      - name: Deploy LINKO UDP Relay
        run: |
          flyctl deploy ./relay \
            --app linko-relay \
            --remote-only

      - name: Verify relay status
        run: |
          flyctl status --app linko-relay

      - name: Verify relay health
        run: |
          for i in {1..12}; do
            if curl --fail --show-error --silent --max-time 5 https://linko-relay.fly.dev/health; then
              echo
              echo "Relay health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Relay health check failed after deployment."
          exit 1
