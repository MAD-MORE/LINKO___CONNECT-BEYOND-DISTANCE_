name: LINKO Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Cross-layer integrity check
        working-directory: .
        run: python android/scripts/verify_linko_integrity.py
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check
        working-directory: backend
        run: node --check src/server.js
      - name: Tests
        working-directory: backend
        run: timeout 30s npm test
        env:
          NODE_ENV: test
          LINKO_JWT_SECRET: test-secret-minimum-32-bytes-long-ok
          PORT: '18080'

  direct-p2p-contract:
    name: Verify Direct-P2P Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active Android/control-plane code has no relay transport
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.sql' \
            '(RELAY_NODE_ID|RELAY_REGION|FLY_API_TOKEN|no_healthy_relay|relay_nodes)' \
            android backend/src backend/package.json 2>/dev/null; then
            echo 'Active application/control-plane code still references relay transport.'
            exit 1
          fi
          echo 'Direct-P2P contract verified.'
