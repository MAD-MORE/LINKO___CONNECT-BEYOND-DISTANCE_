name: LINKO Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build, Test, Sign & Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Cross-layer integrity check
        working-directory: .
        run: python android/scripts/verify_linko_integrity.py
      - name: Calculate build number
        id: build_number
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable development signing key
        if: github.event_name != 'pull_request'
        working-directory: .
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LINKO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINKO_KEY_ALIAS || 'linko' }}
          KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'LINKO_KEYSTORE_BASE64 is required'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'LINKO_KEYSTORE_PASSWORD is required'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'LINKO_KEY_PASSWORD is required'; exit 1; }
          work_dir="$RUNNER_TEMP/linko-signing"
          mkdir -p "$work_dir"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$work_dir/input.bin"
          normalized="$work_dir/linko-keystore.jks"
          recovered_alias=""
          if keytool -list -storetype JKS -keystore "$work_dir/input.bin" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            cp "$work_dir/input.bin" "$normalized"
          else
            for source_type in PKCS12 JCEKS; do
              if keytool -list -storetype "$source_type" -keystore "$work_dir/input.bin" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
                recovered_alias="$KEY_ALIAS"
                if ! keytool -list -storetype "$source_type" -keystore "$work_dir/input.bin" -storepass "$KEYSTORE_PASSWORD" -alias "$recovered_alias" >/dev/null 2>&1; then
                  recovered_alias="$(keytool -list -storetype "$source_type" -keystore "$work_dir/input.bin" -storepass "$KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | xargs)"
                fi
                [ -n "$recovered_alias" ] || { echo 'No PrivateKeyEntry found'; exit 1; }
                keytool -importkeystore -noprompt -srckeystore "$work_dir/input.bin" -srcstoretype "$source_type" -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$recovered_alias" -srckeypass "$KEY_PASSWORD" -destkeystore "$normalized" -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -destalias "$recovered_alias" -destkeypass "$KEY_PASSWORD"
                break
              fi
            done
          fi
          if [ ! -s "$normalized" ]; then echo 'LINKO signing keystore recovery failed'; exit 1; fi
          if [ -z "$recovered_alias" ]; then
            recovered_alias="$(keytool -list -storetype JKS -keystore "$normalized" -storepass "$KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | xargs)"
          fi
          [ -n "$recovered_alias" ] || { echo 'LINKO signing keystore contains no PrivateKeyEntry'; exit 1; }
          keytool -importkeystore -noprompt -srckeystore "$normalized" -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$recovered_alias" -srckeypass "$KEY_PASSWORD" -destkeystore android/linko-dev.keystore -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -destalias "$recovered_alias" -destkeypass "$KEY_PASSWORD" >/dev/null
          keytool -list -storetype JKS -keystore android/linko-dev.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$recovered_alias" >/dev/null
          echo "LINKO_KEY_ALIAS=$recovered_alias" >> "$GITHUB_ENV"
          echo 'Stable LINKO signing keystore validated with recovered alias.'
      - name: Build signed update APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
        env:
          LINKO_KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          LINKO_KEY_ALIAS: ${{ env.LINKO_KEY_ALIAS || secrets.LINKO_KEY_ALIAS || 'linko' }}
          LINKO_KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linko-signed-release-${{ steps.build_number.outputs.version_name }}-${{ steps.build_number.outputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          VERSION_CODE: ${{ steps.build_number.outputs.version_code }}
          VERSION_NAME: ${{ steps.build_number.outputs.version_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          manifest = {
              "schemaVersion": 1,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkAsset": "app-release.apk",
              "commit": os.environ["GITHUB_SHA"],
          }
          with open("linko-update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, separators=(",", ":"))
              f.write("\n")
          PY
          cat linko-update.json
      - name: Publish latest LINKO development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.build_number.outputs.version_code }}
          VERSION_NAME: ${{ steps.build_number.outputs.version_name }}
        run: gh release create "dev-build-${VERSION_CODE}" android/app/build/outputs/apk/release/app-release.apk linko-update.json --title "LINKO development build ${VERSION_NAME} (${VERSION_CODE})" --notes "Automatic development build from commit ${GITHUB_SHA}.\nMachine-readable updater manifest is included as linko-update.json." --latest
      - name: Remove generated update manifest
        if: always()
        working-directory: .
        run: rm -f linko-update.json
      - name: Remove signing key
        if: always()
        working-directory: .
        run: rm -f android/linko-dev.keystore

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check
        working-directory: backend
        run: node --check src/server.js
      - name: Tests
        working-directory: backend
        run: timeout 30s npm test
        env:
          NODE_ENV: test
          LINKO_JWT_SECRET: test-secret-minimum-32-bytes-long-ok
          PORT: '18080'

  direct-p2p-contract:
    name: Verify Direct-P2P Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active Android/control-plane code has no relay transport
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.sql' \
            '(RELAY_NODE_ID|RELAY_REGION|FLY_API_TOKEN|no_healthy_relay|relay_nodes)' \
            android backend/src backend/package.json 2>/dev/null; then
            echo 'Active application/control-plane code still references relay transport.'
            exit 1
          fi
          echo 'Direct-P2P contract verified.'
