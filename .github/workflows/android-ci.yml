name: Android CI

on:
  push:
    branches: [main, develop, feature/real-data-plane-internet-sharing]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Signed APK, Test & Publish Update
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew
      - name: Verify cross-layer integrity
        run: python android/scripts/verify_linko_integrity.py
      - name: Calculate build number
        id: build_number
        shell: bash
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "version_code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Restore LINKO signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.LINKO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing LINKO_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/linko-dev.keystore
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          LINKO_KEYSTORE_PASSWORD: ${{ secrets.LINKO_KEYSTORE_PASSWORD }}
          LINKO_KEY_PASSWORD: ${{ secrets.LINKO_KEY_PASSWORD }}
          LINKO_KEY_ALIAS: linko
          LINKO_CONTROL_PLANE_URL: ${{ secrets.LINKO_CONTROL_PLANE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co/functions/v1/linko-control-plane' }}
          LINKO_SUPABASE_URL: ${{ secrets.LINKO_SUPABASE_URL || 'https://pbnvssbtshvesqwhckfa.supabase.co' }}
          LINKO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LINKO_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_lUMjChFhCBKATMQzEpD5vg_ZdSc6Fw9' }}
        run: ./gradlew assembleRelease --no-daemon -PLINKO_VERSION_CODE=${{ steps.build_number.outputs.version_code }} -PLINKO_VERSION_NAME=${{ steps.build_number.outputs.version_name }}
      - name: Upload release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linko-release-${{ steps.build_number.outputs.version_code }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linko-build-${{ steps.build_number.outputs.version_code }}
          name: LINKO Build ${{ steps.build_number.outputs.version_code }}
          body: |
            Automatic LINKO development update.
            Commit: ${{ github.sha }}
            Build: ${{ steps.build_number.outputs.version_code }}
          files: android/app/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove signing keystore
        if: always()
        run: rm -f android/linko-dev.keystore
