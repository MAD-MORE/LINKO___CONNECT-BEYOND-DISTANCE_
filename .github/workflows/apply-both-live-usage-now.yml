name: LINKO apply both live usage now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply shared live usage UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          card = Path('android/app/src/main/java/com/linkshare/app/ui/screens/LiveUsageCard.kt')
          card.write_text('''package com.linkshare.app.ui.screens

import androidx.compose.foundation.layout.Spacer
import androidx.compose.foundation.layout.height
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.ui.Modifier
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import com.linkshare.app.ui.components.InfoRow
import com.linkshare.app.ui.components.LinkoCard
import com.linkshare.app.ui.theme.Blue
import com.linkshare.app.ui.theme.Green
import com.linkshare.app.ui.theme.TextPrimary
import com.linkshare.app.ui.theme.TextSub

@Composable
fun LinkoLiveUsageCard(
    bytesIn: Long,
    bytesOut: Long,
    latencyMs: Long = 0L,
    role: String,
) {
    val safeIn = bytesIn.coerceAtLeast(0L)
    val safeOut = bytesOut.coerceAtLeast(0L)
    val total = safeIn + safeOut
    LinkoCard {
        Text("LIVE USAGE", color = Green, fontSize = 14.sp, fontWeight = FontWeight.Bold)
        Spacer(Modifier.height(4.dp))
        Text(
            if (role == "RECEIVER") "Live traffic through your friend's connection" else "Live traffic shared with your connected friend",
            color = TextSub,
            fontSize = 10.sp
        )
        Spacer(Modifier.height(9.dp))
        InfoRow("DOWNLOADED", formatUsageBytes(safeIn), if (role == "RECEIVER") "Internet received on this phone" else "Data received by the connected receiver", Blue, true)
        Spacer(Modifier.height(7.dp))
        InfoRow("UPLOADED", formatUsageBytes(safeOut), if (role == "RECEIVER") "Traffic sent through the provider" else "Data sent from the provider", Green, true)
        Spacer(Modifier.height(7.dp))
        InfoRow("TOTAL USAGE", formatUsageBytes(total), "Combined live session traffic", TextPrimary, true)
        if (latencyMs > 0L) {
            Spacer(Modifier.height(7.dp))
            InfoRow("LATENCY", "${latencyMs} ms", "Live response time", Blue)
        }
    }
}

private fun formatUsageBytes(bytes: Long): String = when {
    bytes < 1024L -> "$bytes B"
    bytes < 1024L * 1024L -> "${bytes / 1024L} KB"
    bytes < 1024L * 1024L * 1024L -> String.format(java.util.Locale.US, "%.1f MB", bytes / 1024.0 / 1024.0)
    else -> String.format(java.util.Locale.US, "%.2f GB", bytes / 1024.0 / 1024.0 / 1024.0)
}
''')

          receiver = Path('android/app/src/main/java/com/linkshare/app/ui/screens/ConnectionStatusScreen.kt')
          r = receiver.read_text()
          r2, n = re.subn(
              r'(?s)        if \(state\.phase == LinkoConnectionPhase\.Connected\) \{.*?        \}\n\n        if \(!vpnGranted\)',
              '''        if (state.phase == LinkoConnectionPhase.Connected) {
            Spacer(Modifier.height(12.dp))
            LinkoLiveUsageCard(
                bytesIn = state.bytesIn,
                bytesOut = state.bytesOut,
                latencyMs = state.latencyMs.toLong(),
                role = "RECEIVER",
            )
            Spacer(Modifier.height(10.dp))
            LinkoCard {
                Text("CONNECTION ACTIVE", color = Green, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                Spacer(Modifier.height(4.dp))
                Text("Your phone is currently using the provider's internet connection. Usage updates live while the session is active.", color = TextSub, fontSize = 11.sp, textAlign = TextAlign.Center, modifier = Modifier.fillMaxWidth())
            }
        }

        if (!vpnGranted)''',
              r,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'receiver block replacement matched {n}')
          receiver.write_text(r2)

          engine = Path('android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt')
          e = engine.read_text()
          start = e.index('@Composable fun ProviderSharingActiveScreen(')
          end = e.index('@Composable fun ProviderLiveUsageScreen(', start)
          provider = '''@Composable fun ProviderSharingActiveScreen(onLiveUsage: () -> Unit, onStop: () -> Unit) {
    val engineState by LinkoEngineBridge.connection.collectAsStateWithLifecycle()
    val receiverName = engineState.peerDisplayName?.takeIf { it.isNotBlank() } ?: "LINKO Friend"
    val receiverId = engineState.peerLinkoId?.takeIf { it.isNotBlank() }?.let { "@${it.removePrefix("@")}" } ?: "@connected_friend"
    Column(
        Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(horizontal = 16.dp, vertical = 12.dp),
        horizontalAlignment = Alignment.CenterHorizontally
    ) {
        Spacer(Modifier.height(10.dp))
        Ring(Green, 170.dp, idle = false, label = "SHARING", pulse = true, incomingFlow = true)
        Spacer(Modifier.height(14.dp))
        Text("CONNECTION ACTIVE", color = Green, fontSize = 12.sp, fontFamily = JetBrainsMono, fontWeight = FontWeight.Bold)
        Spacer(Modifier.height(5.dp))
        Text("Sharing your internet with $receiverName", color = TextPrimary, fontSize = 19.sp, fontFamily = JetBrainsMono, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center)
        Spacer(Modifier.height(4.dp))
        Text(receiverId, color = TextSub, fontSize = 11.sp, fontFamily = JetBrainsMono)
        Spacer(Modifier.height(16.dp))

        LinkoLiveUsageCard(
            bytesIn = engineState.bytesIn,
            bytesOut = engineState.bytesOut,
            latencyMs = engineState.latencyMs.toLong(),
            role = "PROVIDER",
        )

        Spacer(Modifier.height(12.dp))
        LinkoCard {
            InfoRow("SESSION", engineState.sessionId?.take(8)?.plus("…") ?: "ACTIVE", "Current LINKO sharing session", Green)
            Spacer(Modifier.height(7.dp))
            InfoRow("STATUS", if (engineState.phase == com.linkshare.app.network.LinkoConnectionPhase.Connected) "CONNECTED" else engineState.phase.name.uppercase(), "Live engine state", Green, true)
        }

        Spacer(Modifier.height(18.dp))
        PrimaryButton("STOP SHARING", onStop, color = Red, outline = true)
        Spacer(Modifier.height(20.dp))
    }
}

'''
          engine.write_text(e[:start] + provider + e[end:])
          PY

          grep -q 'fun LinkoLiveUsageCard' android/app/src/main/java/com/linkshare/app/ui/screens/LiveUsageCard.kt
          grep -q 'LinkoLiveUsageCard' android/app/src/main/java/com/linkshare/app/ui/screens/ConnectionStatusScreen.kt
          grep -q 'LinkoLiveUsageCard' android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt
          grep -q 'STOP SHARING' android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt

      - name: Commit changes and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/linkshare/app/ui/screens/LiveUsageCard.kt android/app/src/main/java/com/linkshare/app/ui/screens/ConnectionStatusScreen.kt android/app/src/main/java/com/linkshare/app/ui/screens/EngineScreens.kt
          git commit -m 'fix(android): show live usage on provider and receiver [skip-live-usage-patch]' || true
          git rm .github/workflows/apply-both-live-usage-now.yml
          git commit -m 'chore: remove live usage patch workflow [skip-live-usage-patch]'
          git push origin main
