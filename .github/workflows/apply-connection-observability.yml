name: Apply Connection Observability

on:
  push:
    branches:
      - feature/production-connection-observability

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[linko-observability-patched]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply production connection diagnostics
        run: python3 tools/apply_connection_observability.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android tools/apply_connection_observability.py .github/workflows/apply-connection-observability.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[linko-observability-patched] Wire real connection diagnostics into LINKO"
          git push origin HEAD:${GITHUB_REF_NAME}
