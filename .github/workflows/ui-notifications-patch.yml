name: LINKO UI Notifications Patch
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path
          nav = Path('android/app/src/main/java/com/linkshare/app/Navigation.kt')
          s = nav.read_text()
          s = s.replace('object SessionHistory : Screen("session_history")', 'object SessionHistory : Screen("session_history")\n    object Notifications : Screen("notifications")')
          s = s.replace('val bottomNavScreens = setOf(Screen.HomeEngine.route, Screen.Friends.route, Screen.SessionHistory.route, Screen.Settings.route, Screen.DiagnosticCenter.route)', 'val bottomNavScreens = setOf(Screen.HomeEngine.route, Screen.Friends.route, Screen.SessionHistory.route, Screen.Notifications.route, Screen.Settings.route, Screen.DiagnosticCenter.route)')
          s = s.replace('route == Screen.SessionHistory.route -> "HISTORY"', 'route == Screen.SessionHistory.route -> "HISTORY"\n    route == Screen.Notifications.route -> "NOTIFICATIONS"')
          nav.write_text(s)

          app = Path('android/app/src/main/java/com/linkshare/app/ui/screens/LinkoApp.kt')
          s = app.read_text()
          s = s.replace('import androidx.compose.material.icons.filled.Settings', 'import androidx.compose.material.icons.filled.Settings\nimport androidx.compose.material.icons.filled.Notifications')
          s = s.replace('import androidx.compose.material.icons.outlined.Settings', 'import androidx.compose.material.icons.outlined.Settings\nimport androidx.compose.material.icons.outlined.Notifications')
          s = s.replace('composable(Screen.SessionHistory.route) { SessionHistoryScreen() }', 'composable(Screen.SessionHistory.route) { SessionHistoryScreen() }\n                composable(Screen.Notifications.route) { NotificationsScreen() }')
          s = s.replace('"usage" to "Usage", "session_details" to "Session", "session_history" to "Session History",', '"usage" to "Usage", "session_details" to "Session", "session_history" to "Session History", "notifications" to "Notifications",')
          s = s.replace('object Settings : BottomNavItem("SETTINGS", Screen.Settings.route, Icons.Filled.Settings, Icons.Outlined.Settings)', 'object Notifications : BottomNavItem("NOTIFICATIONS", Screen.Notifications.route, Icons.Filled.Notifications, Icons.Outlined.Notifications)\n    object Settings : BottomNavItem("SETTINGS", Screen.Settings.route, Icons.Filled.Settings, Icons.Outlined.Settings)')
          s = s.replace('    BottomNavItem.History,\n    BottomNavItem.Settings', '    BottomNavItem.History,\n    BottomNavItem.Notifications,\n    BottomNavItem.Settings')
          s = s.replace('                                    BottomNavItem.Friends -> {', '                                    BottomNavItem.Notifications -> {\n                                        val notificationCount = friendRequestCount + if (hasIncomingConnection) 1 else 0\n                                        if (notificationCount > 0) NavBadge(count = notificationCount, color = Red, modifier = Modifier.align(Alignment.TopEnd).offset(x = 10.dp, y = (-5).dp))\n                                    }\n                                    BottomNavItem.Friends -> {')
          app.write_text(s)

          screen = Path('android/app/src/main/java/com/linkshare/app/ui/screens/NotificationsScreen.kt')
          if not screen.exists():
              screen.write_text('''package com.linkshare.app.ui.screens

import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material.icons.Icons
import androidx.compose.material.icons.filled.Notifications
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import com.linkshare.app.network.LinkoRealtimeEvent
import com.linkshare.app.network.LinkoRealtimeManager
import com.linkshare.app.ui.theme.*

@Composable
fun NotificationsScreen() {
    val notifications = remember { mutableStateListOf<String>() }
    LaunchedEffect(Unit) {
        LinkoRealtimeManager.events.collect { event ->
            val message = when (event) {
                is LinkoRealtimeEvent.FriendRequestReceived -> "New friend request received"
                is LinkoRealtimeEvent.FriendRequestAccepted -> "Friend request accepted"
                is LinkoRealtimeEvent.FriendRequestDeclined -> "Friend request declined"
                is LinkoRealtimeEvent.FriendRemoved -> "A friend was removed"
                is LinkoRealtimeEvent.IncomingConnectionRequest -> "Incoming connection request"
                is LinkoRealtimeEvent.SessionStateChanged -> "Connection status: ${event.state}"
                else -> null
            }
            if (message != null) { notifications.add(0, message); if (notifications.size > 30) notifications.removeLast() }
        }
    }
    Column(Modifier.fillMaxSize().padding(18.dp)) {
        Row(verticalAlignment = Alignment.CenterVertically) {
            Icon(Icons.Filled.Notifications, null, tint = Blue)
            Spacer(Modifier.width(8.dp))
            Text("Notifications", color = TextPrimary, fontSize = 22.sp, fontFamily = JetBrainsMono)
        }
        Spacer(Modifier.height(6.dp))
        Text("Friend requests and connection activity appear here.", color = TextSub, fontSize = 12.sp)
        Spacer(Modifier.height(18.dp))
        if (notifications.isEmpty()) {
            Surface(Modifier.fillMaxWidth(), RoundedCornerShape(16.dp), color = Card) {
                Column(Modifier.padding(18.dp)) {
                    Text("You're all caught up", color = TextPrimary, fontSize = 15.sp, fontFamily = JetBrainsMono)
                    Spacer(Modifier.height(4.dp))
                    Text("New activity will appear here automatically.", color = TextSub, fontSize = 12.sp)
                }
            }
        } else notifications.forEach { message ->
            Surface(Modifier.fillMaxWidth().padding(bottom = 8.dp), RoundedCornerShape(14.dp), color = Card) {
                Text(message, Modifier.padding(16.dp), color = TextPrimary, fontSize = 13.sp)
            }
        }
    }
}
''')
      - name: Commit and remove patcher
        run: |
          rm -f .github/workflows/ui-notifications-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): add unified notifications tab' || exit 0
          git push