name: LINKO Full Validation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: CodeQL, Secrets & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependency audit
        run: |
          set -euo pipefail
          for dir in backend relay; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install && npm audit --audit-level=moderate)
            fi
          done
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  relay-udp:
    name: Relay UDP Protocol Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install relay dependencies
        working-directory: relay
        run: npm install
      - name: Build relay
        working-directory: relay
        run: npm run build
      - name: Run relay tests
        working-directory: relay
        run: npm test
      - name: Build relay container
        working-directory: relay
        run: docker build -t linko-relay:validation .
      - name: Start UDP relay
        run: |
          set -euo pipefail
          docker run --rm -d --name linko-validation-relay \
            -e RELAY_NODE_ID=validation-relay \
            -e RELAY_REGION=validation \
            -p 7000:7000/udp \
            -p 7001:7001 \
            linko-relay:validation node dist/relay-server.js
          trap 'docker logs linko-validation-relay || true; docker stop linko-validation-relay >/dev/null 2>&1 || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:7001/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:7001/health
      - name: Exercise UDP forwarding contract
        env:
          LINKO_RELAY_HOST: 127.0.0.1
          LINKO_RELAY_UDP_PORT: 7000
          LINKO_UDP_SMOKE_TIMEOUT: 5
        run: python3 relay/scripts/verify_public_udp.py
