# docker-compose to run signaling, relay, and coturn for staging
version: '3.8'
services:
  signaling:
    build: ./backend/signaling
    ports:
      - "3000:3000"
    restart: unless-stopped
  relay:
    build: ./backend/relay
    ports:
      - "4000:4000"
    restart: unless-stopped
  coturn:
    image: instrumentisto/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped
