app = "linko-relay"
primary_region = "jnb"

[build]
  dockerfile = "infra/relay.dockerfile"

[env]
  RELAY_PORT = "3479"
  HEALTH_PORT = "8080"
  MAX_SESSIONS = "1000"
  SESSION_TTL_MS = "120000"

[[services]]
  internal_port = 3479
  protocol = "udp"

  [[services.ports]]
    port = 3479

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 8080

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
