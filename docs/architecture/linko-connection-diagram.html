<title>LINKO — Connect Beyond Distance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--bg:#050912;--panel:#0e1830;--line:#1c2c4d;--cyan:#4fd1ff;--green:#5eead4;--amber:#ffb454;--violet:#a78bfa;--hi:#eaf2ff;--mid:#9fb3d1;--lo:#5f7ba0}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,#10203f 0%,transparent 60%),radial-gradient(1000px 600px at 105% 10%,#131b3a 0%,transparent 55%),var(--bg);color:var(--hi);font-family:'Space Grotesk',sans-serif}body{overflow-x:auto}.wrap{width:1800px;margin:auto;padding:36px}.mono{font-family:'IBM Plex Mono',monospace}header{text-align:center;margin-bottom:18px}.eyebrow{font:12px 'IBM Plex Mono';letter-spacing:.35em;color:#7fe3ff;text-transform:uppercase;margin-bottom:10px}h1{font-size:44px;margin:0;background:linear-gradient(90deg,#eaf2ff,#bfe9ff,#7fe3ff);-webkit-background-clip:text;color:transparent}.sub{margin-top:10px;color:var(--mid);font-size:16px}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0}.legend span{border:1px solid var(--line);background:#ffffff05;border-radius:8px;padding:8px 12px;font:11px 'IBM Plex Mono';color:var(--mid)}.dot{display:inline-block;width:20px;height:4px;border-radius:4px;margin-right:7px;vertical-align:middle}.note{text-align:center;color:var(--lo);font:11px 'IBM Plex Mono';margin-top:14px}
svg{display:block;background:linear-gradient(180deg,#07101d66,#07101d22);border:1px solid #13233f;border-radius:16px;box-shadow:0 20px 70px #0008}
</style>

<body>
<div class="wrap">
<header><div class="eyebrow">Technical Architecture Overview</div><h1>LINKO — CONNECT BEYOND DISTANCE</h1><div class="sub">How an authorized Receiver uses a Provider's Internet connection</div></header>
<div class="legend">
<span><i class="dot" style="background:#5eead4"></i>Direct / tunnel</span>
<span><i class="dot" style="background:#ffb454"></i>Relay fallback</span>
<span><i class="dot" style="background:#7fe3ff;border-top:1px dashed #7fe3ff"></i>Control / signaling</span>
</div>
<svg viewBox="0 0 1800 1120" width="1800" height="1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LINKO connection architecture diagram">
<defs>
<linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a2540"/><stop offset="1" stop-color="#0c1526"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d1b33"/><stop offset="1" stop-color="#081222"/></linearGradient>
<linearGradient id="direct" x1="0" x2="1"><stop stop-color="#4fd1ff"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<linearGradient id="relay" x1="0" x2="1"><stop stop-color="#ffb454"/><stop offset="1" stop-color="#f59e4a"/></linearGradient>

<marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7185a8"/></marker>
</defs>
<!-- background -->
<g opacity=".22" stroke="#17305a"><path d="M0 250H1800M0 500H1800M0 750H1800M0 1000H1800"/><path d="M150 0V1120M450 0V1120M750 0V1120M1050 0V1120M1350 0V1120M1650 0V1120"/></g>

<text x="900" y="78" text-anchor="middle" class="mono" fill="#eaf2ff" font-size="16" font-weight="700" letter-spacing="1.5">LINKO CONTROL PLANE</text>
<text x="900" y="98" text-anchor="middle" class="mono" fill="#7f93b8" font-size="10">coordinates identity, authorization, session and signaling — not the traffic destination</text>
<g class="mono" font-size="11">
<g><rect x="595" y="115" width="145" height="58" rx="8" fill="#0e1a34" stroke="#2b3f68"/><circle cx="618" cy="135" r="4" fill="#5eead4"/><text x="667" y="142" text-anchor="middle" fill="#cfe0fb">Authentication</text></g>
<g><rect x="755" y="115" width="145" height="58" rx="8" fill="#0e1a34" stroke="#2b3f68"/><circle cx="778" cy="135" r="4" fill="#5eead4"/><text x="827" y="142" text-anchor="middle" fill="#cfe0fb">Authorization</text></g>
<g><rect x="915" y="115" width="145" height="58" rx="8" fill="#0e1a34" stroke="#2b3f68"/><circle cx="938" cy="135" r="4" fill="#5eead4"/><text x="987" y="142" text-anchor="middle" fill="#cfe0fb">Session</text></g>
<g><rect x="1075" y="115" width="130" height="58" rx="8" fill="#0e1a34" stroke="#2b3f68"/><circle cx="1098" cy="135" r="4" fill="#5eead4"/><text x="1140" y="142" text-anchor="middle" fill="#cfe0fb">Signaling</text></g></g>

<path d="M1100 195 C1190 235 1390 265 1545 330" fill="none" stroke="#7fe3ff" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 7" marker-end="url(#aG)"/>
<text x="405" y="267" class="mono" fill="#5f83ad" font-size="10">CONTROL / SIGNALING</text><text x="1395" y="267" class="mono" fill="#5f83ad" font-size="10">CONTROL / SIGNALING</text>

<text x="900" y="262" text-anchor="middle" class="mono" fill="#c99a63" font-size="10">used when direct connectivity cannot be established</text>

<text x="900" y="310" text-anchor="middle" class="mono" fill="#ffd9a3" font-size="13" font-weight="700">LINKO RELAY</text><text x="900" y="328" text-anchor="middle" class="mono" fill="#c99a63" font-size="9">OPTIONAL FALLBACK NODE</text>
<g stroke="#e8a955" opacity=".65"><path d="M820 345H980M820 355H980M820 365H980M820 375H980"/></g>
<path d="M310 470 C500 410 650 350 800 335" fill="none" stroke="url(#relay)" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#aA)"/>
<path d="M1000 335 C1150 350 1300 410 1490 470" fill="none" stroke="url(#relay)" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#aA)"/>

<text x="900" y="430" text-anchor="middle" class="mono" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="1.4">DIRECT PATH</text>
<text x="900" y="448" text-anchor="middle" class="mono" fill="#7f93b8" font-size="10.5">preferred when direct connectivity is possible</text>
<rect x="310" y="475" width="1180" height="56" rx="28" fill="#08131f" stroke="url(#direct)" stroke-width="2.5" filter="url(#glow)"/>
<rect x="312" y="477" width="1176" height="52" rx="26" fill="none" stroke="#bff6ff" stroke-opacity=".14"/>
<text x="900" y="498" text-anchor="middle" class="mono" fill="#c9fff2" font-size="12" font-weight="700">ENCRYPTED LINKO TUNNEL</text>
<g fill="#bff6ff"><circle cx="400" cy="515" r="4"/><circle cx="520" cy="515" r="4"/><circle cx="640" cy="515" r="4"/><circle cx="760" cy="515" r="4"/><circle cx="880" cy="515" r="4"/><circle cx="1000" cy="515" r="4"/><circle cx="1120" cy="515" r="4"/><circle cx="1240" cy="515" r="4"/><circle cx="1360" cy="515" r="4"/></g>
<path d="M345 493H470" stroke="#5eead4" stroke-width="2.5" marker-end="url(#aC)"/><path d="M1455 515H1330" stroke="#ffb454" stroke-width="2.5" marker-end="url(#aA)"/>
<text x="345" y="463" class="mono" fill="#5eead4" font-size="9">REQUEST →</text><text x="1455" y="545" text-anchor="end" class="mono" fill="#ffb454" font-size="9">← RESPONSE</text>

<text x="205" y="590" text-anchor="middle" class="mono" fill="#eaf2ff" font-size="14" font-weight="700" letter-spacing="1">RECEIVER — YOUR PHONE</text>
<rect x="85" y="320" width="240" height="330" rx="30" fill="url(#phone)" stroke="#33456e" stroke-width="2"/><rect x="98" y="345" width="214" height="282" rx="12" fill="url(#screen)" stroke="#1c2c4d"/><rect x="165" y="327" width="80" height="6" rx="3" fill="#0c1526"/>
<rect x="108" y="355" width="194" height="30" rx="7" fill="#132139"/><circle cx="126" cy="370" r="6" fill="#5eead4"/><text x="140" y="374" class="mono" fill="#eaf2ff" font-size="11" font-weight="700">LINKO</text><text x="292" y="374" text-anchor="end" class="mono" fill="#5eead4" font-size="8">CONNECTED</text>
<g class="mono" font-size="8"><rect x="110" y="397" width="58" height="32" rx="6" fill="#0e1a30" stroke="#26385c"/><text x="139" y="417" text-anchor="middle" fill="#9db6dd">Browser</text><rect x="173" y="397" width="58" height="32" rx="6" fill="#0e1a30" stroke="#26385c"/><text x="202" y="417" text-anchor="middle" fill="#9db6dd">YouTube</text><rect x="236" y="397" width="58" height="32" rx="6" fill="#0e1a30" stroke="#26385c"/><text x="265" y="417" text-anchor="middle" fill="#9db6dd">Game</text></g>
<g class="mono" font-size="9"><rect x="110" y="445" width="190" height="25" rx="6" fill="#101f3a" stroke="#2b3f68"/><text x="205" y="462" text-anchor="middle" fill="#c3d3ef">APPS</text><path d="M205 471V481" stroke="#7185a8" marker-end="url(#aG)"/><rect x="110" y="484" width="190" height="25" rx="6" fill="#101f3a" stroke="#2b3f68"/><text x="205" y="501" text-anchor="middle" fill="#c3d3ef">ANDROID NETWORK</text><path d="M205 510V520" stroke="#7185a8" marker-end="url(#aG)"/><rect x="110" y="523" width="190" height="28" rx="6" fill="#122645" stroke="#4fd1ff"/><text x="205" y="541" text-anchor="middle" fill="#bfeeff" font-weight="700">LINKO VPN (VpnService)</text><path d="M205 552V562" stroke="#4fd1ff" marker-end="url(#aC)"/><rect x="110" y="565" width="190" height="28" rx="6" fill="#0e2a2e" stroke="#5eead4"/><text x="205" y="583" text-anchor="middle" fill="#c9fff2" font-weight="700">LINKO TUNNEL</text></g>
<!-- provider phone -->
<text x="1595" y="590" text-anchor="middle" class="mono" fill="#eaf2ff" font-size="14" font-weight="700" letter-spacing="1">PROVIDER — FRIEND'S PHONE</text>
<rect x="1475" y="320" width="240" height="330" rx="30" fill="url(#phone)" stroke="#33456e" stroke-width="2"/><rect x="1488" y="345" width="214" height="282" rx="12" fill="url(#screen)" stroke="#1c2c4d"/><rect x="1555" y="327" width="80" height="6" rx="3" fill="#0c1526"/>
<rect x="1498" y="355" width="194" height="30" rx="7" fill="#132139"/><circle cx="1516" cy="370" r="6" fill="#5eead4"/><text x="1530" y="374" class="mono" fill="#eaf2ff" font-size="11" font-weight="700">LINKO</text>
<rect x="1498" y="397" width="194" height="43" rx="8" fill="#132a1f" stroke="#5eead4"/><circle cx="1515" cy="418" r="5" fill="#5eead4"/><text x="1528" y="414" class="mono" fill="#bdfff0" font-size="10" font-weight="700">SHARING INTERNET</text><text x="1528" y="428" class="mono" fill="#5eead4" font-size="9">● ACTIVE</text>
<g class="mono" font-size="9"><rect x="1498" y="452" width="190" height="28" rx="6" fill="#0e2a2e" stroke="#5eead4"/><text x="1593" y="470" text-anchor="middle" fill="#c9fff2" font-weight="700">LINKO TUNNEL ENDPOINT</text><path d="M1593 481V491" stroke="#7185a8" marker-end="url(#aG)"/><rect x="1498" y="494" width="190" height="25" rx="6" fill="#101f3a" stroke="#2b3f68"/><text x="1593" y="511" text-anchor="middle" fill="#c3d3ef">ANDROID NETWORK</text><path d="M1593 520V530" stroke="#7185a8" marker-end="url(#aG)"/><rect x="1498" y="533" width="190" height="30" rx="6" fill="#18243d" stroke="#ffb454"/><text x="1593" y="552" text-anchor="middle" fill="#ffd9a3" font-weight="700">MOBILE DATA</text></g>
<!-- tower -->
<g transform="translate(1570 680)"><circle cx="25" cy="55" r="100" fill="#4fd1ff" opacity=".08"/><path d="M25 15V155M-25 155H75M-5 115H55M5 75H45M15 35H35M-5 155 25 15 55 155" fill="none" stroke="#6885ad" stroke-width="5"/><path d="M-2 35Q25 10 52 35M-12 12Q25 -25 62 12" fill="none" stroke="#4fd1ff" stroke-width="3" opacity=".8"/><text x="25" y="185" text-anchor="middle" class="mono" fill="#c3d3ef" font-size="11">PROVIDER'S MOBILE NETWORK</text><text x="25" y="201" text-anchor="middle" class="mono" fill="#7185a8" font-size="9">4G / 5G</text></g>
<path d="M1593 650V720" stroke="#4fd1ff" stroke-width="3" marker-end="url(#aC)"/>
<!-- internet -->
<g transform="translate(1220 760)"><path d="M70 95C35 95 15 75 15 48 15 23 37 5 62 7 75-22 115-28 137 2 172-2 195 20 195 48 195 76 173 95 145 95Z" fill="#12203a" stroke="#4fd1ff" stroke-opacity=".6" stroke-width="2"/><text x="105" y="52" text-anchor="middle" class="mono" fill="#eaf2ff" font-size="15" font-weight="700">INTERNET</text><text x="105" y="72" text-anchor="middle" class="mono" fill="#7f93b8" font-size="9">DESTINATION SERVICES</text></g>
<path d="M1595 870 C1510 870 1420 870 1315 850" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#aC)"/>
<!-- traffic route labels -->
<rect x="520" y="690" width="760" height="82" rx="12" fill="#0b1526" stroke="#1c2c4d"/>
<text x="900" y="716" text-anchor="middle" class="mono" fill="#7fe3ff" font-size="11" font-weight="700">DATA PLANE — ACTUAL NETWORK TRAFFIC</text>
<text x="900" y="740" text-anchor="middle" class="mono" fill="#c3d3ef" font-size="11">Receiver apps → Linko VPN → encrypted tunnel → Provider → mobile network → Internet</text>
<text x="900" y="758" text-anchor="middle" class="mono" fill="#7185a8" font-size="9">Responses return through the same authorized tunnel path</text>
<!-- sequence -->
<rect x="35" y="790" width="470" height="280" rx="14" fill="#0e1830" stroke="#1c2c4d"/>
<text x="55" y="820" class="mono" fill="#7fe3ff" font-size="12" font-weight="700" letter-spacing="1.5">CONNECTION SEQUENCE</text>
<g class="mono" fill="#c3d3ef" font-size="10.5"><text x="55" y="846"><tspan fill="#5eead4" font-weight="700">1</tspan> Receiver requests connection</text><text x="55" y="868"><tspan fill="#5eead4" font-weight="700">2</tspan> Provider accepts</text><text x="55" y="890"><tspan fill="#5eead4" font-weight="700">3</tspan> Linko authenticates and authorizes</text><text x="55" y="912"><tspan fill="#5eead4" font-weight="700">4</tspan> Signaling coordinates endpoints</text><text x="55" y="934"><tspan fill="#5eead4" font-weight="700">5</tspan> Direct path is attempted</text><text x="55" y="956"><tspan fill="#ffb454" font-weight="700">6</tspan> Relay is used if direct fails</text><text x="55" y="978"><tspan fill="#5eead4" font-weight="700">7</tspan> Linko tunnel is established</text><text x="55" y="1000"><tspan fill="#5eead4" font-weight="700">8</tspan> Receiver traffic is routed through Provider</text><text x="55" y="1022"><tspan fill="#5eead4" font-weight="700">9</tspan> Provider sends traffic to Internet</text><text x="55" y="1044"><tspan fill="#5eead4" font-weight="700">10</tspan> Responses return through tunnel</text></g>
<!-- architecture principles -->
<rect x="540" y="805" width="1225" height="265" rx="14" fill="#0e1830" stroke="#1c2c4d"/>
<text x="565" y="835" class="mono" fill="#7fe3ff" font-size="12" font-weight="700" letter-spacing="1.5">ARCHITECTURE PRINCIPLES</text>
<g class="mono" font-size="11"><rect x="565" y="855" width="355" height="78" rx="10" fill="#0b1526" stroke="#26385c"/><text x="742" y="880" text-anchor="middle" fill="#eaf2ff" font-weight="700">CONTROL PLANE</text><text x="742" y="900" text-anchor="middle" fill="#9fb3d1">Identity • Authorization • Session</text><text x="742" y="916" text-anchor="middle" fill="#7185a8">Signaling and coordination</text><rect x="945" y="855" width="355" height="78" rx="10" fill="#0b1526" stroke="#26385c"/><text x="1122" y="880" text-anchor="middle" fill="#eaf2ff" font-weight="700">DATA PLANE</text><text x="1122" y="900" text-anchor="middle" fill="#9fb3d1">Actual packets and responses</text><text x="1122" y="916" text-anchor="middle" fill="#7185a8">Carried through the tunnel</text><rect x="1325" y="855" width="410" height="78" rx="10" fill="#0b1526" stroke="#26385c"/><text x="1530" y="880" text-anchor="middle" fill="#eaf2ff" font-weight="700">PROVIDER CONNECTIVITY</text><text x="1530" y="900" text-anchor="middle" fill="#9fb3d1">Friend's mobile network</text><text x="1530" y="916" text-anchor="middle" fill="#7185a8">Ultimately reaches the Internet</text></g>
<text x="1152" y="978" text-anchor="middle" class="mono" fill="#c3d3ef" font-size="12" font-weight="700">IMPORTANT</text>
<text x="1152" y="1000" text-anchor="middle" class="mono" fill="#9fb3d1" font-size="10.5">Linko does not create free mobile data or transfer a Provider's data balance.</text>
<text x="1152" y="1020" text-anchor="middle" class="mono" fill="#9fb3d1" font-size="10.5">It creates an authorized network path so Receiver traffic can be forwarded through the Provider.</text>
</svg>
<div class="note">LINKO architecture reference • Direct-first with relay fallback • Control plane separated from data plane</div>
</div>
